<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Discourse Workshop</title>
<meta name="description" content="Discourse analysis for Bible translators — Dr. Steven Rungee, Hyderabad 2024.">
<!-- Not for search engines: the page carries links to unlisted recordings. -->
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme:dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Discourse Workshop — Slate
   Topic is the spine. Day and session are secondary. Panels sit beside the
   content rather than covering it. Mobile first; columns appear at 1120px.
   ========================================================================== */
:root{
  --bg:#FFFFFF; --card:#F7F9FB; --sunk:#F0F3F7; --raise:#FFFFFF;
  --tx:#131A24; --tx2:#55636F; --tx3:#8A97A3;
  --line:#E1E6EB; --line2:#CDD5DD;
  --acc:#1A63D8; --acc-tx:#FFFFFF; --acc-w:#1A63D80E; --acc-b:#1A63D8;
  --ok:#1F7A4D; --ok-w:#1F7A4D14;
  --warn:#9A5B12;
  --sh:0 1px 2px #131A2410; --sh2:0 4px 16px #131A2414;
  --ui:'Inter Tight',system-ui,-apple-system,Segoe UI,sans-serif;
  --mo:'IBM Plex Mono',ui-monospace,monospace;
  --rl:250px; --rr:230px; --bar:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-t=light]){
  --bg:#0D1117; --card:#141A22; --sunk:#11161D; --raise:#171E27;
  --tx:#E4EBF2; --tx2:#94A2B0; --tx3:#6B7885;
  --line:#222B36; --line2:#2E3945;
  --acc:#5CA0FF; --acc-tx:#08111C; --acc-w:#5CA0FF14; --acc-b:#5CA0FF;
  --ok:#4CC38A; --ok-w:#4CC38A14; --warn:#D4A257;
  --sh:0 1px 2px #0006; --sh2:0 4px 16px #0007;
}}
:root[data-t=dark]{
  --bg:#0D1117; --card:#141A22; --sunk:#11161D; --raise:#171E27;
  --tx:#E4EBF2; --tx2:#94A2B0; --tx3:#6B7885;
  --line:#222B36; --line2:#2E3945;
  --acc:#5CA0FF; --acc-tx:#08111C; --acc-w:#5CA0FF14; --acc-b:#5CA0FF;
  --ok:#4CC38A; --ok-w:#4CC38A14; --warn:#D4A257;
  --sh:0 1px 2px #0006; --sh2:0 4px 16px #0007;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  text-align:left}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mo{font-family:var(--mo)}

/* ---------------- top bar ---------------- */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:stretch;
  background:var(--bg);border-bottom:1px solid var(--line);
  height:calc(var(--bar) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px;font-weight:700;font-size:14px;
  letter-spacing:-.015em;flex:0 0 auto}
.brand i{width:7px;height:7px;border-radius:2px;background:var(--acc);flex:0 0 auto}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:none}
@media (min-width:1120px){
  .brand{width:var(--rl);border-right:1px solid var(--line)}
  .nav{display:flex}
  .nav button{padding:0 15px;font-size:13px;color:var(--tx2);border-bottom:2px solid transparent;
    display:flex;align-items:center}
  .nav button:hover{color:var(--tx)}
  .nav button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:500}
}
.spacer{flex:1}
.ib{width:38px;display:grid;place-items:center;color:var(--tx2);flex:0 0 auto}
.ib:hover{color:var(--tx);background:var(--sunk)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.pgw{display:none}
@media (min-width:600px){
  .pgw{display:flex;align-items:center;gap:8px;padding:0 14px;font-family:var(--mo);
    font-size:10.5px;color:var(--tx3)}
  .pgb{width:78px;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
  .pgb i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
}

/* ---------------- 3-column shell ---------------- */
.grid{display:block}
.colL,.colR{display:none}
@media (min-width:1120px){
  .grid{display:grid;grid-template-columns:var(--rl) minmax(0,1fr) var(--rr);
    align-items:start}
  .colL,.colR{display:block;position:sticky;
    top:calc(var(--bar) + env(safe-area-inset-top));
    height:calc(100dvh - var(--bar) - env(safe-area-inset-top));
    overflow-y:auto;overscroll-behavior:contain}
  .colL{border-right:1px solid var(--line);background:var(--sunk)}
  .colR{border-left:1px solid var(--line)}
}
.colM{min-width:0}

/* ---------------- column headers ---------------- */
.ch{position:sticky;top:0;z-index:2;background:var(--sunk);border-bottom:1px solid var(--line);
  font-family:var(--mo);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);padding:9px 14px 7px;display:flex;align-items:center;gap:8px}
.colR .ch{background:var(--bg)}
.ch b{color:var(--tx2);font-weight:500}
.ch .r{margin-left:auto;letter-spacing:0;text-transform:none}

/* ---------------- topic rail ---------------- */
.tp{display:flex;gap:9px;width:100%;padding:7px 14px;font-size:12.5px;line-height:1.34;
  border-bottom:1px solid var(--line);align-items:baseline;color:var(--tx2)}
.tp:hover{background:var(--acc-w);color:var(--tx)}
.tp.on{background:var(--acc-w);box-shadow:inset 2px 0 0 var(--acc);color:var(--tx);font-weight:500}
.tp em{font-style:normal;font-family:var(--mo);font-size:9.5px;color:var(--tx3);flex:0 0 20px}
.tp.seen em{color:var(--ok)}
.tp .tt{flex:1;min-width:0}
.tp.dead .tt{font-style:italic;color:var(--tx3)}
.grp{font-family:var(--mo);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);padding:11px 14px 5px;background:var(--sunk);
  border-bottom:1px solid var(--line);display:flex}
.grp .r{margin-left:auto;letter-spacing:0;text-transform:none}

/* ---------------- main ---------------- */
.wrap{padding:18px 16px 44px;max-width:900px}
@media (min-width:1120px){.wrap{padding:20px 26px 60px}}

.crumb{font-family:var(--mo);font-size:10.5px;color:var(--tx3);margin-bottom:9px;
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.crumb button{color:var(--tx2)}
.crumb button:hover{color:var(--acc);text-decoration:underline}
.crumb .tag{border:1px solid var(--line2);border-radius:99px;padding:1px 8px;color:var(--tx3)}
.crumb .tag.w{color:var(--warn);border-color:var(--warn)}

h1{font-size:23px;line-height:1.22;letter-spacing:-.025em;margin:0 0 10px;font-weight:600}
@media (min-width:720px){h1{font-size:27px}}
.lede{font-size:15.5px;line-height:1.62;color:var(--tx2);margin:0 0 16px;max-width:68ch}

.refs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.rf{font-family:var(--mo);font-size:11.5px;padding:4px 10px;border-radius:6px;
  border:1px solid var(--line2);color:var(--tx2)}
.rf:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-w)}

/* ---------------- part list (thumbnails) ---------------- */
.parts{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.parts{grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}}
.part{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);
  display:flex;flex-direction:column;transition:border-color .12s,box-shadow .12s}
.part:hover{border-color:var(--acc);box-shadow:var(--sh2)}
.part.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-w)}
.part .im{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.part .im img{width:100%;height:100%;object-fit:cover}
.part .pl{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(180deg,#0000 40%,#0009)}
.part .pl i{width:42px;height:42px;border-radius:50%;background:#FFFFFFEC;display:grid;
  place-items:center;box-shadow:0 2px 10px #0006;transition:transform .12s}
.part:hover .pl i{transform:scale(1.07)}
.part .pl i::after{content:"";border-left:12px solid #12181F;border-top:7.5px solid transparent;
  border-bottom:7.5px solid transparent;margin-left:3px}
.part .tm{position:absolute;right:6px;bottom:6px;background:#000B;color:#fff;
  font-family:var(--mo);font-size:10px;padding:2px 6px;border-radius:4px}
.part .mt{padding:9px 11px 11px}
.part .mt b{display:block;font-size:13px;font-weight:500;line-height:1.32}
.part .mt small{display:block;font-family:var(--mo);font-size:10.5px;color:var(--tx3);margin-top:3px}
.part.seen .mt b{color:var(--tx2)}
.part.seen .mt small::before{content:"✓ ";color:var(--ok)}

/* ---------------- player ---------------- */
.stagebox{margin:0 0 18px;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:#000;box-shadow:var(--sh2)}
.stagebox .fr{position:relative;aspect-ratio:16/9}
.stagebox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pmeta{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--card);
  font-family:var(--mo);font-size:10.5px;color:var(--tx3);flex-wrap:wrap}
.pmeta b{color:var(--tx);font-weight:500;font-family:var(--ui);font-size:12.5px}
.pmeta .r{margin-left:auto;display:flex;gap:8px}
.pmeta a,.pmeta button{color:var(--acc);font-family:var(--mo);font-size:10.5px;
  text-decoration:none}
.pmeta a:hover,.pmeta button:hover{text-decoration:underline}

/* ---------------- prev / next ---------------- */
.pn{display:flex;gap:9px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.pn button{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  min-width:0;background:var(--card)}
.pn button:hover{border-color:var(--acc)}
.pn small{display:block;font-family:var(--mo);font-size:9.5px;color:var(--tx3);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.pn b{display:block;font-size:13px;font-weight:500;line-height:1.32}
.pn .nx{text-align:right}

/* ---------------- home ---------------- */
.hero{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px;
  margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .im{flex:0 0 168px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;
  position:relative}
.hero .im img{width:100%;height:100%;object-fit:cover}
.hero .tx{flex:1;min-width:190px}
.hero small{font-family:var(--mo);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tx3)}
.hero b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;margin:5px 0 4px;
  line-height:1.26}
.hero p{margin:0;font-size:13px;color:var(--tx2);line-height:1.5}
.go{display:inline-flex;align-items:center;gap:7px;background:var(--acc);color:var(--acc-tx);
  padding:8px 15px;border-radius:7px;font-size:13.5px;font-weight:500;margin-top:11px}
.go:hover{filter:brightness(1.08)}
.go svg{width:13px;height:13px;fill:currentColor;stroke:none}

.stats{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
  margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--card)}
.stat b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stat small{font-size:11px;color:var(--tx3)}

.sec{font-family:var(--mo);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);margin:0 0 10px;display:flex;align-items:baseline}
.sec .r{margin-left:auto;letter-spacing:0;text-transform:none;font-size:11px}
.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.day{border:1px solid var(--line);border-radius:9px;padding:12px 13px;background:var(--card)}
.day:hover{border-color:var(--acc)}
.day .n{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.day .n b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.day .n em{font-style:normal;font-family:var(--mo);font-size:10px;color:var(--tx3)}
.day p{margin:0 0 9px;font-size:11.5px;color:var(--tx2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day .bar2{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.day .bar2 i{display:block;height:100%;background:var(--ok)}
.day .mt{display:flex;justify-content:space-between;font-family:var(--mo);font-size:9.5px;
  color:var(--tx3);margin-top:5px}

/* ---------------- pull quote ---------------- */
.quote{position:relative;margin:0 0 24px;padding:20px 20px 18px 22px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc)}
.quote blockquote{margin:0;font-size:18px;line-height:1.5;letter-spacing:-.012em;
  font-weight:500;max-width:52ch}
@media (min-width:720px){.quote{padding:26px 28px 22px 30px}
  .quote blockquote{font-size:21px;line-height:1.46}}
.quote .mk{position:absolute;top:8px;left:10px;font-size:34px;line-height:1;color:var(--acc);
  opacity:.16;font-family:Georgia,serif;pointer-events:none}
.quote figcaption{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px;
  font-family:var(--mo);font-size:10.5px;color:var(--tx3)}
.quote figcaption b{color:var(--tx2);font-weight:500}
.quote .hear{color:var(--acc);display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.quote .hear:hover{text-decoration:underline}
.quote .hear svg{width:11px;height:11px;fill:currentColor;stroke:none}

/* ---------------- day view ---------------- */
.dhero{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.dsess{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:12px;
  background:var(--card)}
.dsh{display:flex;align-items:baseline;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.dsh b{font-size:13.5px;font-weight:600}
.dsh em{font-style:normal;font-family:var(--mo);font-size:10px;color:var(--tx3)}
.dsh .r{margin-left:auto;font-family:var(--mo);font-size:10px;color:var(--tx3)}
.dtp{display:flex;gap:10px;width:100%;padding:9px 14px;border-bottom:1px solid var(--line);
  align-items:baseline;font-size:13.5px;line-height:1.36}
.dsess .dtp:last-child{border-bottom:0}
.dtp:hover{background:var(--acc-w)}
.dtp em{font-style:normal;font-family:var(--mo);font-size:10px;color:var(--tx3);flex:0 0 22px}
.dtp.seen em{color:var(--ok)}
.dtp .tt{flex:1;min-width:0}
.dtp .du{font-family:var(--mo);font-size:10px;color:var(--tx3);flex:0 0 auto}

/* ---------------- right column ---------------- */
.rside{padding-bottom:30px}
.rside .blk{padding:11px 14px;border-bottom:1px solid var(--line)}
.rside .k{font-family:var(--mo);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:7px}
.rside .v{font-size:13px;color:var(--tx2);line-height:1.45}
.rlist{display:block;width:100%;padding:6px 14px;font-size:12.5px;color:var(--tx2);
  border-bottom:1px solid var(--line);line-height:1.35}
.rlist:hover{color:var(--acc);background:var(--acc-w)}
.rlist em{font-style:normal;font-family:var(--mo);font-size:10px;color:var(--tx3);
  display:block;margin-top:1px}

/* ---------------- drawers (mobile) — partial, never full cover -------- */
.scrim{position:fixed;inset:0;z-index:60;background:#0D1117A8;opacity:0;pointer-events:none;
  transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;z-index:61;background:var(--bg);display:flex;flex-direction:column;
  transition:transform .2s ease,opacity .18s ease;box-shadow:var(--sh2)}
.dr.left{top:0;bottom:0;left:0;width:min(84vw,330px);transform:translateX(-101%);
  border-right:1px solid var(--line)}
.dr.left.on{transform:none}
.dr.bot{left:0;right:0;bottom:0;max-height:74dvh;transform:translateY(101%);
  border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  padding-bottom:env(safe-area-inset-bottom)}
.dr.bot.on{transform:none}
@media (prefers-reduced-motion:reduce){.dr,.scrim{transition:none}}
.drh{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);
  padding-top:calc(11px + env(safe-area-inset-top))}
.dr.bot .drh{padding-top:11px}
.dr.bot .drh::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:34px;height:3px;border-radius:99px;background:var(--line2)}
.drh h2{margin:0;font-size:14px;font-weight:600;margin-right:auto}
.drb{flex:1;overflow-y:auto;overscroll-behavior:contain}
@media (min-width:1120px){
  .dr.left{display:none}
  .dr.bot{left:50%;right:auto;bottom:auto;top:50%;
    transform:translate(-50%,-48%) scale(.985);opacity:0;
    width:min(620px,92vw);max-height:min(74dvh,660px);
    border:1px solid var(--line);border-radius:13px}
  .dr.bot.on{transform:translate(-50%,-50%);opacity:1}
  .dr.bot .drh::before{display:none}
}

.q{width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:8px;
  background:var(--sunk);color:var(--tx);border:1px solid transparent}
.q:focus{outline:none;border-color:var(--acc);background:var(--raise)}
.res{display:block;width:100%;padding:10px 14px;border-bottom:1px solid var(--line)}
.res:hover{background:var(--acc-w)}
.res b{display:block;font-size:13.5px;font-weight:500;line-height:1.34}
.res small{font-family:var(--mo);font-size:10px;color:var(--tx3);display:block;margin-top:2px}
.res mark{background:var(--acc-w);color:var(--acc);border-radius:2px}
.none{padding:30px 16px;text-align:center;color:var(--tx3);font-size:13.5px}
.bk{font-family:var(--mo);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tx3);padding:12px 14px 6px;background:var(--sunk);border-bottom:1px solid var(--line);
  position:sticky;top:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:9px 14px 12px}

/* ---------------- mobile tab bar ---------------- */
.tabs{position:sticky;bottom:0;z-index:45;display:flex;background:var(--bg);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:1120px){.tabs{display:none}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 3px 6px;
  color:var(--tx3);font-size:10px;text-align:center}
.tab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><i></i><span>Discourse Workshop</span></div>
  <div class="nav">
    <button data-view="home">Home</button>
    <button data-view="topic" class="on">Topics</button>
    <button data-view="day">Days</button>
    <button data-nav="pass">Passages</button>
  </div>
  <div class="spacer"></div>
  <div class="pgw"><div class="pgb"><i id="pgi"></i></div><span id="pgt"></span></div>
  <button class="ib" id="bSearch" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></button>
  <button class="ib" id="bTheme" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M20.5 14.6A8.2 8.2 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1"/></svg></button>
</header>

<div class="grid">
  <nav class="colL" id="railL" aria-label="Topics"></nav>
  <main class="colM"><div class="wrap" id="main"></div></main>
  <aside class="colR" id="railR" aria-label="Context"></aside>

const T = [];
D.days.forEach(d => d.sessions.forEach(s => s.topics.forEach(t => {
  t._d = d; t._s = s; T.push(t);
})));
const BY = Object.fromEntries(T.map(t => [t.id, t]));

const KEY = 'dws';
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {seen:[],last:null,part:{}}; }
         catch(e){ return {seen:[],last:null,part:{}}; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
};
let S = store.get();
let seen = new Set(S.seen);
let cur = null, curPart = -1, view = 'topic', curDay = null;

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ms = t => `${Math.floor(t/60)}:${String(Math.round(t%60)).padStart(2,'0')}`;
const hm = t => t>=3600 ? `${Math.floor(t/3600)}h ${String(Math.floor(t%3600/60)).padStart(2,'0')}m`
                        : `${Math.floor(t/60)}m`;
const thumb = id => `https://img.youtube.com/vi/${id}/mqdefault.jpg`;

/* ---------------- rails ---------------- */
function topicRail(){
  let out = '', d = null, s = null;
  T.forEach(t => {
    if(t._d !== d || t._s !== s){
      d = t._d; s = t._s;
      out += `<div class="grp"><span>Day ${d.n} · Session ${s.n}</span>
        <span class="r">${hm(s.len)}</span></div>`;
    }
    const i = s.topics.indexOf(t) + 1;
    out += `<button class="tp${seen.has(t.id)?' seen':''}${t.dead?' dead':''}${cur&&cur.id===t.id?' on':''}"
      data-go="${t.id}"><em>${String(i).padStart(2,'0')}</em>
      <span class="tt">${esc(t.t)}</span></button>`;
  });
  return `<div class="ch"><span>All topics</span><span class="r">${T.length}</span></div>${out}`;
}

function contextRail(){
  if(!cur) return '';
  const sib = cur._s.topics;
  const i = sib.indexOf(cur);
  return `<div class="rside">
    <div class="ch"><span>This topic</span></div>
    <div class="blk"><div class="k">Runs</div><div class="v">${ms(cur.len)} · ${cur.segs.length}
      recording${cur.segs.length>1?'s':''}</div></div>
    ${cur.sc && cur.sc.length ? `<div class="blk"><div class="k">Passages</div>
      <div class="chips" style="padding:0;margin-top:4px">${cur.sc.map(r=>
        `<button class="rf" data-find="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>`:''}
    <div class="ch"><span>Session ${cur._s.n}</span><span class="r">${i+1} of ${sib.length}</span></div>
    ${sib.map((x,n)=>`<button class="rlist" data-go="${x.id}"
      style="${x.id===cur.id?'color:var(--acc);background:var(--acc-w)':''}">
      ${esc(x.t)}<em>${String(n+1).padStart(2,'0')} · ${ms(x.len)}</em></button>`).join('')}
  </div>`;
}

/* ---------------- views ---------------- */
function viewHome(){
  const last = S.last && BY[S.last] ? BY[S.last] : T[0];
  const done = seen.size, pct = Math.round(done / T.length * 100);
  return `
    <div class="crumb"><span>Discourse analysis for Bible translators</span></div>
    <h1>Dr. Steven Rungee · Hyderabad, 2024</h1>
    <p class="lede">Ten days, indexed by what is taught rather than by where the camera
      stopped. ${D.nSplit} of ${T.length} topics run across more than one recording;
      each is listed with every part it spans.</p>

    <div class="hero">
      <div class="im"><img loading="lazy" src="${thumb(last.segs[0].v)}" alt=""></div>
      <div class="tx">
        <small>${seen.has(last.id)?'Watched last':'Start here'}</small>
        <b>${esc(last.t)}</b>
        <p>Day ${last.day} · Session ${last.ses} · ${ms(last.len)}</p>
        <button class="go" data-go="${last.id}">
          <svg viewBox="0 0 24 24"><path d="M6 4.5v15l12-7.5z"/></svg>
          ${seen.has(last.id)?'Continue':'Begin'}</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b>${T.length}</b><small>topics</small></div>
      <div class="stat"><b>${D.nVideos}</b><small>recordings</small></div>
      <div class="stat"><b>${hm(D.totalSecs)}</b><small>total</small></div>
      <div class="stat"><b>${D.scripture.length}</b><small>books cited</small></div>
      <div class="stat"><b style="color:var(--ok)">${pct}%</b><small>${done} watched</small></div>
    </div>

    <p class="sec"><span>The ten days</span><span class="r">${D.days.length} days</span></p>
    <div class="days">${D.days.map(d=>{
      const all = d.sessions.flatMap(s=>s.topics);
      const dn = all.filter(t=>seen.has(t.id)).length;
      return `<button class="day" data-day="${d.n}">
        <div class="n"><b>Day ${d.n}</b><em>${esc(d.date)}</em></div>
        <p>${esc(all.slice(0,3).map(t=>t.t).join(' · '))}</p>
        <div class="bar2"><i style="width:${all.length?dn/all.length*100:0}%"></i></div>
        <div class="mt"><span>${all.length} topics</span><span>${hm(d.secs)}</span></div>
      </button>`;}).join('')}</div>`;
}

function quoteBlock(d){
  if(!d.quote) return '';
  const q = d.quote;
  return '<figure class="quote"><span class="mk">\u201C</span>' +
    '<blockquote>' + esc(q.quote) + '</blockquote>' +
    '<figcaption><b>Dr. Steven Rungee</b><span>\u00B7</span>' +
    '<span>' + esc(q.context) + '</span><span>\u00B7</span>' +
    '<a class="hear" href="https://youtu.be/' + q.video + '?t=' + q.at +
      '" target="_blank" rel="noopener">' +
    '<svg viewBox="0 0 24 24"><path d="M6 4.5v15l12-7.5z"/></svg>hear it \u00B7 ' +
    esc(q.label) + ' ' + ms(q.at) + '</a></figcaption></figure>';
}

function viewDay(){
  const d = curDay || (cur ? cur._d : D.days[0]);
  const all = d.sessions.flatMap(s => s.topics);
  const done = all.filter(t => seen.has(t.id)).length;
  return '<div class="crumb"><button data-view="home">Home</button><span>/</span>' +
    '<span>Day ' + d.n + ' of ' + D.days.length + '</span>' +
    '<span class="tag">' + esc(d.long) + '</span></div>' +
    '<div class="dhero"><h1 style="margin:0">Day ' + d.n + '</h1>' +
    '<span class="mo" style="color:var(--tx3);font-size:11.5px">' +
      all.length + ' topics \u00B7 ' + d.sessions.length + ' sessions \u00B7 ' +
      hm(d.secs) + ' \u00B7 ' + done + ' watched</span></div>' +
    '<p class="lede">' + esc(all.slice(0,4).map(t=>t.t).join(' \u00B7 ')) + '</p>' +
    quoteBlock(d) +
    d.sessions.map(function(s){
      return '<section class="dsess"><div class="dsh"><b>Session ' + s.n + '</b>' +
        '<em>' + s.topics.length + ' topics</em><span class="r">' + hm(s.len) + '</span></div>' +
        s.topics.map(function(t,i){
          return '<button class="dtp' + (seen.has(t.id)?' seen':'') + '" data-go="' + t.id + '">' +
            '<em>' + String(i+1).padStart(2,'0') + '</em>' +
            '<span class="tt">' + esc(t.t) + '</span>' +
            '<span class="du">' + ms(t.len) +
              (t.segs.length>1 ? ' \u00B7 ' + t.segs.length + 'p' : '') + '</span></button>';
        }).join('') + '</section>';
    }).join('') +
    '<div class="pn">' +
    (d.n>1 ? '<button data-day="' + (d.n-1) + '"><small>Previous day</small><b>Day ' +
             (d.n-1) + '</b></button>' : '<span style="flex:1"></span>') +
    (d.n<D.days.length ? '<button class="nx" data-day="' + (d.n+1) +
             '"><small>Next day</small><b>Day ' + (d.n+1) + '</b></button>'
           : '<span style="flex:1"></span>') + '</div>';
}

function viewTopic(){
  const t = cur, sib = t._s.topics, i = T.indexOf(t);
  const prev = T[i-1], next = T[i+1];
  return `
    <div class="crumb">
      <button data-view="home">Home</button><span>/</span>
      <button data-day="${t.day}">Day ${t.day}</button><span>/</span>
      <span>Session ${t.ses}</span><span>/</span>
      <span>${sib.indexOf(t)+1} of ${sib.length}</span>
      <span class="tag">${ms(t.len)}</span>
      ${t.segs.length>1?`<span class="tag">${t.segs.length} recordings</span>`:''}
      ${t.mute?`<span class="tag w">${Math.round(t.mute/60)} min without audio</span>`:''}
    </div>
    <h1>${esc(t.t)}</h1>
    ${t.sum?`<p class="lede">${esc(t.sum)}</p>`:''}
    ${t.sc&&t.sc.length?`<div class="refs">${t.sc.map(r=>
      `<button class="rf" data-find="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:''}
    ${(curPart<0 && t._d.quote && t._s.topics.indexOf(t)===0) ? quoteBlock(t._d) : ''}
    <div id="stage"></div>
    <p class="sec"><span>${t.segs.length>1?'Parts of this topic':'Recording'}</span>
      <span class="r">${t.segs.length}</span></p>
    <div class="parts">${t.segs.map((g,n)=>`
      <button class="part${curPart===n?' on':''}${(S.part[t.id]||[]).includes(n)?' seen':''}"
        data-part="${n}">
        <span class="im"><img loading="lazy" src="${thumb(g.v)}" alt="">
          <span class="pl"><i></i></span>
          <span class="tm">${ms(g.e-g.s)}</span></span>
        <span class="mt"><b>${t.segs.length>1?`Part ${n+1}`:esc(t.t)}</b>
          <small>${esc(g.l)} · from ${ms(g.s)}</small></span>
      </button>`).join('')}</div>
    <div class="pn">
      ${prev?`<button data-go="${prev.id}"><small>Previous</small><b>${esc(prev.t)}</b></button>`
            :'<span style="flex:1"></span>'}
      ${next?`<button class="nx" data-go="${next.id}"><small>Next</small><b>${esc(next.t)}</b></button>`
            :'<span style="flex:1"></span>'}
    </div>`;
}

function render(){
  document.getElementById('main').innerHTML =
    view === 'home' ? viewHome() : view === 'day' ? viewDay() : viewTopic();
  document.getElementById('railL').innerHTML = topicRail();
  document.getElementById('railR').innerHTML =
    (view === 'home' || view === 'day') ? homeContext() : contextRail();
  document.getElementById('drTopicsB').innerHTML = topicRail();
  document.querySelectorAll('.nav button[data-view]').forEach(b =>
    b.classList.toggle('on', b.dataset.view === view));
  const act = document.querySelector('.colL .tp.on');
  if(act) act.scrollIntoView({block:'nearest'});
  paint();
}

function homeContext(){
  return `<div class="rside"><div class="ch"><span>Jump to a day</span></div>
    ${D.days.map(d=>{const a=d.sessions.flatMap(s=>s.topics);
      return `<button class="rlist" data-day="${d.n}">Day ${d.n}
        <em>${esc(d.date)} · ${a.length} topics</em></button>`;}).join('')}
    <div class="ch"><span>Passages</span><span class="r">${D.scripture.length} books</span></div>
    <div class="chips">${D.scripture.slice(0,16).map(b=>
      `<button class="rf" data-book="${esc(b.book)}">${esc(b.book.replace(/^([123])/,'$1 '))}</button>`).join('')}</div>
  </div>`;
}

function paint(){
  const pct = seen.size / T.length * 100;
  const i = document.getElementById('pgi'); if(i) i.style.width = pct + '%';
  const t = document.getElementById('pgt'); if(t) t.textContent = Math.round(pct) + '%';
}

/* ---------------- playback ---------------- */
function playPart(n){
  const g = cur.segs[n]; if(!g) return;
  curPart = n;
  const box = document.getElementById('stage');
  if(!box) return;
  box.innerHTML = `<div class="stagebox"><div class="fr">
      <iframe src="https://www.youtube-nocookie.com/embed/${g.v}?start=${g.s}&end=${g.e}&rel=0&modestbranding=1&autoplay=1&playsinline=1"
        title="${esc(cur.t)}" allow="accelerometer;autoplay;encrypted-media;picture-in-picture;fullscreen"
        allowfullscreen></iframe></div>
    <div class="pmeta"><b>${cur.segs.length>1?`Part ${n+1} of ${cur.segs.length}`:'Now playing'}</b>
      <span>${esc(g.l)} · ${ms(g.s)}–${ms(g.e)}</span>
      <span class="r">
        ${cur.segs.length>1&&n+1<cur.segs.length?`<button data-part="${n+1}">Next part →</button>`:''}
        <a href="https://youtu.be/${g.v}?t=${g.s}" target="_blank" rel="noopener">Open on YouTube</a>
      </span></div></div>`;
  seen.add(cur.id);
  S.seen = [...seen];
  S.part[cur.id] = [...new Set([...(S.part[cur.id]||[]), n])];
  store.set(S);
  document.querySelectorAll('.part').forEach((el,k)=>{
    el.classList.toggle('on', k===n);
    if(k===n) el.classList.add('seen');
  });
  document.querySelectorAll(`[data-go="${cur.id}"]`).forEach(el=>el.classList.add('seen'));
  paint();
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function goTopic(id, opts={}){
  const t = BY[id]; if(!t) return;
  cur = t; curPart = -1; view = 'topic';
  S.last = id; store.set(S);
  render();
  location.hash = id;
  document.title = `${t.t} · Discourse Workshop`;
  if(opts.scroll !== false) window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------------- search & passages ---------------- */
function search(q){
  const box = document.getElementById('drSearchB');
  q = q.trim().toLowerCase();
  if(!q){ box.innerHTML = `<p class="none">Search ${T.length} topics by title, summary, or passage.</p>`; return; }
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig');
  const hits = T.filter(t => (t.t+' '+t.sum+' '+(t.sc||[]).join(' ')).toLowerCase().includes(q)).slice(0,60);
  box.innerHTML = hits.length ? hits.map(t=>`<button class="res" data-go="${t.id}" data-x>
      <b>${esc(t.t).replace(re,'<mark>$1</mark>')}</b>
      <small>Day ${t.day} · Session ${t.ses} · ${ms(t.len)}${(t.sc||[]).length?' · '+esc(t.sc.join(', ')):''}</small>
    </button>`).join('') : `<p class="none">Nothing matches “${esc(q)}”.</p>`;
}

function passHTML(){
  return D.scripture.map(b=>`<div class="bk">${esc(b.book.replace(/^([123])/,'$1 '))}</div>
    <div class="chips">${b.refs.map(r=>`<button class="rf" data-go="${r.id}" data-x>${esc(r.ref)}</button>`).join('')}</div>`).join('');
}
function daysHTML(){
  return D.days.map(d=>{
    const a = d.sessions.flatMap(s=>s.topics);
    const dn = a.filter(t=>seen.has(t.id)).length;
    return `<div class="grp"><span>Day ${d.n} · ${esc(d.date)}</span>
      <span class="r">${dn}/${a.length}</span></div>` +
      d.sessions.map(s=>s.topics.map((t,i)=>`<button class="tp${seen.has(t.id)?' seen':''}" data-go="${t.id}" data-x>
        <em>${s.n}.${i+1}</em><span class="tt">${esc(t.t)}</span></button>`).join('')).join('');
  }).join('');
}

/* ---------------- drawers ---------------- */
function openDr(id, title){
  document.querySelectorAll('.dr').forEach(d=>d.classList.remove('on'));
  const d = document.getElementById(id); if(!d) return;
  d.classList.add('on'); document.getElementById('scrim').classList.add('on');
  if(title) document.getElementById('drTitle').textContent = title;
  const f = d.querySelector('input'); if(f) setTimeout(()=>f.focus(),80);
}
function closeDr(){
  document.querySelectorAll('.dr').forEach(d=>d.classList.remove('on'));
  document.getElementById('scrim').classList.remove('on');
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const part = e.target.closest('[data-part]');
  if(part){ playPart(+part.dataset.part); return; }
  const find = e.target.closest('[data-find]');
  if(find){ openDr('drSearch'); const q=document.getElementById('q');
            q.value = find.dataset.find; search(q.value); return; }
  const book = e.target.closest('[data-book]');
  if(book){ document.getElementById('drPassB').innerHTML = passHTML();
            openDr('drPass'); return; }
  const go = e.target.closest('[data-go]');
  if(go){ if(e.target.closest('[data-x]')) closeDr(); goTopic(go.dataset.go); return; }
  const dy = e.target.closest('[data-day]');
  if(dy){ curDay = D.days.find(x=>x.n===+dy.dataset.day) || D.days[0];
          view = 'day'; closeDr(); render();
          window.scrollTo({top:0,behavior:'smooth'}); return; }
  const v = e.target.closest('[data-view]');
  if(v){ view = v.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const nav = e.target.closest('[data-nav]');
  if(nav){
    if(nav.dataset.nav==='days'){ document.getElementById('drTopicsB').innerHTML = daysHTML();
      openDr('drTopics','Days & sessions'); }
    else { document.getElementById('drPassB').innerHTML = passHTML(); openDr('drPass'); }
    return;
  }
  if(e.target.closest('[data-x]') || e.target.id === 'scrim'){ closeDr(); }
});
document.getElementById('bSearch').onclick = () => { search(''); openDr('drSearch'); };
document.getElementById('q').addEventListener('input', e => search(e.target.value));
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  const k = b.dataset.tab;
  if(k==='home'){ closeDr(); view='home'; render(); window.scrollTo({top:0}); }
  else if(k==='topics'){ document.getElementById('drTopicsB').innerHTML = topicRail();
    openDr('drTopics','Topics'); }
  else if(k==='days'){ closeDr(); curDay = cur ? cur._d : D.days[0]; view='day'; render();
    window.scrollTo({top:0}); }
  else if(k==='pass'){ document.getElementById('drPassB').innerHTML = passHTML(); openDr('drPass'); }
  else { search(''); openDr('drSearch'); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeDr();
  if(e.key==='/' && !/input|textarea/i.test(e.target.tagName)){ e.preventDefault(); search(''); openDr('drSearch'); }
});

const root = document.documentElement;
try{ const t = localStorage.getItem('dws-theme'); if(t) root.dataset.t = t; }catch(e){}
document.getElementById('bTheme').onclick = () => {
  const dark = root.dataset.t ? root.dataset.t==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.t = dark ? 'light' : 'dark';
  try{ localStorage.setItem('dws-theme', root.dataset.t); }catch(e){}
};

const h0 = location.hash.slice(1);
if(BY[h0]){ cur = BY[h0]; view = 'topic'; }
else { cur = (S.last && BY[S.last]) ? BY[S.last] : T[0]; view = S.last ? 'home' : 'home'; }
render();
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if(BY[h] && (!cur || cur.id !== h)) goTopic(h, {scroll:false});
});
</script>
</body>
</html>
